services:
  - type: web
    name: pothole-detection-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_REPO_ID
        value: TLxGHOST/pothole-model # ← change this
      - key: HF_TOKEN
        sync: false #
